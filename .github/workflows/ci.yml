name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Hak minimum: CI hanya membaca repo. Tidak ada rahasia yang dipakai (semua nilai di bawah hanya untuk database CI sekali pakai).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck, build, migrasi, tes)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-superuser-not-a-secret
          POSTGRES_DB: wazap_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d wazap_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Role aplikasi/tes meniru role dev: BUKAN superuser dan tanpa BYPASSRLS (superuser melewati RLS dan membuat tes isolasi tak berarti).
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: wazap_ci
      DB_USERNAME: wazap_ci
      DB_PASSWORD: ci-only-not-a-secret
      JWT_SECRET: ci-only-jwt-secret-not-a-secret-0123456789
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # pagar migrasi membandingkan dengan commit dasar
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Siapkan role database non-superuser
        env:
          PGPASSWORD: ci-superuser-not-a-secret
        run: |
          psql -h 127.0.0.1 -U postgres -d wazap_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE wazap_ci LOGIN PASSWORD 'ci-only-not-a-secret' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT CREATE ON DATABASE wazap_ci TO wazap_ci;
          SQL

      - name: Instal dependensi (sesuai lockfile)
        working-directory: backend
        run: npm ci

      - name: Pagar migrasi (tidak boleh mengubah migrasi terapan, nomor berurutan)
        run: backend/scripts/check-migrations.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Tes dalam mode kontrak (tes dilewati/dibatalkan = gagal; tiap response asli divalidasi terhadap skema OpenAPI)
        working-directory: backend
        env:
          WAZAP_CONTRACT_CHECK: '1'
          MIN_TESTS: '300'
        run: scripts/ci-test.sh

  frontend:
    name: Frontend (instal, typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instal dependensi (sesuai lockfile)
        working-directory: frontend
        run: npm ci

      - name: Typecheck dan build (tsc --noEmit lalu vite build)
        working-directory: frontend
        run: npm run build

  deploy-config:
    name: Konfigurasi deploy (skrip dan vhost Nginx)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Sintaks skrip
        run: |
          set -e
          for f in deploy/staging/bin/*.sh deploy/production/bin/*.sh deploy/ops/*.sh backend/scripts/*.sh; do bash -n "$f" && echo "ok $f"; done
          for f in deploy/staging/bin/*.mjs deploy/staging/tools/*.mjs deploy/staging/ecosystem.config.cjs deploy/production/ecosystem.config.cjs; do node --check "$f" && echo "ok $f"; done

      - name: Vhost Nginx dirender dan lolos `nginx -t`
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx >/dev/null
          T="$(mktemp -d)"; mkdir -p "$T/web" "$T/run/tmp"
          WAZAP_ENV_DIR="$T/env" deploy/staging/bin/make-cert.sh "$T/tls"
          deploy/staging/bin/render-nginx.sh "$T/vhost.conf" 8443 "$T/tls" "$T/web"
          sed -e "s#@RUN_DIR@#$T/run#g" -e "s#@VHOST@#$T/vhost.conf#g" deploy/staging/nginx/user-nginx.conf.tpl > "$T/nginx.conf"
          nginx -t -c "$T/nginx.conf" -e "$T/run/error.log"
          # aturan keamanan yang sudah terbukti di staging: XFF HARUS ditimpa, bukan ditambah
          grep -qF 'X-Forwarded-For   $remote_addr' "$T/vhost.conf"
          # `! cmd` tidak memicu set -e, jadi pakai if eksplisit
          if grep -v '^[[:space:]]*#' "$T/vhost.conf" | grep -qF 'proxy_add_x_forwarded_for'; then echo 'GAGAL: X-Forwarded-For ditambah, bukan ditimpa'; exit 1; fi

      - name: Vhost produksi (dua host) dirender dan lolos `nginx -t`
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx >/dev/null
          T="$(mktemp -d)"; mkdir -p "$T/web" "$T/out" "$T/tmp"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$T/privkey.pem" -out "$T/fullchain.pem" -days 1 -subj "/CN=wazap.bolinggo.org" 2>/dev/null
          CERT_DIR="$T" WEB_ROOT="$T/web" deploy/production/bin/render-nginx.sh "$T/out" 300
          # pengguna runner bukan root: salinan uji memakai port tinggi (templat produksi tetap 80/443)
          sed -i -e 's/listen 80;/listen 18080;/' -e 's/listen \[::\]:80;/listen [::1]:18080;/' -e 's/listen 443 ssl/listen 18443 ssl/' -e 's/listen \[::\]:443 ssl/listen [::1]:18443 ssl/' "$T/out/wazap.conf"
          printf 'pid %s/nginx.pid;\nevents {}\nhttp { access_log off; client_body_temp_path %s/b; proxy_temp_path %s/p; fastcgi_temp_path %s/f; uwsgi_temp_path %s/u; scgi_temp_path %s/s; include %s/out/wazap.conf; }\n' "$T" "$T" "$T" "$T" "$T" "$T" "$T" > "$T/nginx.conf"
          nginx -t -c "$T/nginx.conf" -e "$T/error.log"
          grep -qF 'X-Forwarded-For   $remote_addr' "$T/out/wazap-locations.conf" "$T/out/wazap.conf"
          if grep -hv '^[[:space:]]*#' "$T/out/wazap.conf" "$T/out/wazap-locations.conf" | grep -qF 'proxy_add_x_forwarded_for'; then echo 'GAGAL: X-Forwarded-For ditambah, bukan ditimpa'; exit 1; fi
          # mode Cloudflare: IP pengunjung dari CF-Connecting-IP hanya dari rentang tepercaya; templat harus lolos nginx -t
          mkdir -p "$T/cf"; printf 'set_real_ip_from 127.0.0.1;\nreal_ip_header CF-Connecting-IP;\nreal_ip_recursive off;\n' > "$T/cf/cloudflare-realip.conf"
          CLOUDFLARE=1 CERT_DIR="$T" WEB_ROOT="$T/web" deploy/production/bin/render-nginx.sh "$T/cf" 300
          sed -i -e 's/listen 80;/listen 18080;/' -e 's/listen \[::\]:80;/listen [::1]:18080;/' -e 's/listen 443 ssl/listen 18443 ssl/' -e 's/listen \[::\]:443 ssl/listen [::1]:18443 ssl/' "$T/cf/wazap.conf"
          sed -i "s#$T/out/wazap.conf#$T/cf/wazap.conf#" "$T/nginx.conf"
          nginx -t -c "$T/nginx.conf" -e "$T/error.log"
          grep -q 'cloudflare-realip.conf;' "$T/cf/wazap.conf"
          # satu origin untuk dashboard; host API tidak boleh melayani dashboard
          grep -q 'server_name wazap.bolinggo.org;' "$T/out/wazap.conf"
          grep -q 'server_name api-wazap.bolinggo.org;' "$T/out/wazap.conf"

      - name: Vhost tunnel Cloudflare dirender dan lolos `nginx -t`
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx >/dev/null
          T="$(mktemp -d)"; mkdir -p "$T/web" "$T/out"
          TUNNEL=1 WEB_ROOT="$T/web" ACCESS_LOG="$T/acc.log" deploy/production/bin/render-nginx.sh "$T/out" 300
          # pengunjung tidak boleh melewati Cloudflare: hanya loopback yang dilayani, dan IP pengunjung dari CF-Connecting-IP
          grep -q 'real_ip_header CF-Connecting-IP' "$T/out/wazap.conf"
          grep -q 'return 403' "$T/out/wazap.conf"
          if grep -hv '^[[:space:]]*#' "$T/out/wazap.conf" | grep -qE 'listen[[:space:]]+(127\.0\.0\.1|\[::1\]):80'; then echo 'GAGAL: listen 127.0.0.1:80 mengambil SEMUA permintaan loopback milik situs lain'; exit 1; fi
          if grep -hv '^[[:space:]]*#' "$T/out/wazap.conf" "$T/out/wazap-locations.conf" | grep -qF 'proxy_add_x_forwarded_for'; then echo 'GAGAL: X-Forwarded-For ditambah, bukan ditimpa'; exit 1; fi
          sed -i -e 's/listen 80;/listen 18081;/' -e 's/listen \[::\]:80;/listen [::1]:18081;/' "$T/out/wazap.conf"
          printf 'pid %s/nginx.pid;\nevents {}\nhttp { access_log off; client_body_temp_path %s/b; proxy_temp_path %s/p; fastcgi_temp_path %s/f; uwsgi_temp_path %s/u; scgi_temp_path %s/s; include %s/out/wazap.conf; }\n' "$T" "$T" "$T" "$T" "$T" "$T" "$T" > "$T/nginx.conf"
          nginx -t -c "$T/nginx.conf" -e "$T/error.log"

  hygiene:
    name: Higiene repo (rahasia dan berkas lingkungan)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Skrip shell tercatat executable di git
        # Repo dikembangkan di partisi NTFS (core.fileMode=false) sehingga bit executable mudah hilang; clone di CI/server lalu mendapat
        # skrip yang tidak dapat dijalankan langsung ("Permission denied"). Tandai dengan: git update-index --chmod=+x <berkas>
        run: |
          bad="$(git ls-files -s -- '*.sh' | awk '$1 != "100755" {print $4}')"
          if [ -n "$bad" ]; then echo "GAGAL: skrip tanpa bit executable di git:"; echo "$bad"; exit 1; fi
          echo "semua skrip *.sh executable"

      - name: Tidak ada arsip atau hasil build ter-commit
        # Arsip (zip/tar) dan dist/ adalah artefak, bukan sumber; mudah tak sengaja ikut `git add -A`.
        run: |
          bad="$(git ls-files | grep -E '\.(zip|tar|tgz|tar\.gz|7z|rar)$|(^|/)dist/' || true)"
          if [ -n "$bad" ]; then echo "GAGAL: arsip/hasil build ter-commit:"; echo "$bad"; exit 1; fi
          echo "tidak ada arsip atau hasil build ter-commit"

      - name: Tidak ada symlink atau node_modules ter-commit
        # Symlink mode 120000 menunjuk path lokal (mis. /home/.../node_modules) dan merusak npm ci di CI; pola .gitignore `node_modules/` tidak mengabaikan symlink.
        run: |
          bad="$(git ls-files -s | awk '$1 == "120000" {print $4}'; git ls-files | grep -E '(^|/)node_modules(/|$)' || true)"
          if [ -n "$bad" ]; then echo "GAGAL: symlink/node_modules ter-commit:"; echo "$bad"; exit 1; fi
          echo "tidak ada symlink atau node_modules ter-commit"

      - name: Tidak ada berkas env/rahasia yang ter-commit
        run: |
          set -u; bad=0
          while IFS= read -r f; do
            case "$f" in *.env.example) ;; *) echo "GAGAL: berkas lingkungan ter-commit: $f"; bad=1;; esac
          done < <(git ls-files | grep -E '(^|/)\.env($|\.)' || true)
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY' -- . ':!.github' >/tmp/k 2>&1; then cat /tmp/k; echo "GAGAL: kunci privat ter-commit"; bad=1; fi
          if git grep -nIE '(CREDENTIAL_ENCRYPTION_KEYS|JWT_SECRET|DB_PASSWORD|DB_MIGRATE_PASSWORD)=[A-Za-z0-9+/_-]{20,}' -- ':!.github' ':!docs' >/tmp/s 2>&1; then sed -E 's/=.*/=<disembunyikan>/' /tmp/s; echo "GAGAL: nilai rahasia ter-commit"; bad=1; fi
          exit $bad

  audit:
    name: Audit dependensi (informasi, tidak memblokir)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: npm audit (produksi, tingkat tinggi ke atas)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
